[package]
name = "ratsu"
version = "2.0.0"
edition = "2024"
authors = ["Eetu Rantala"]

[lib]
name = "ratsu"
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1.12.2"
pyo3 = { version = "0.28.3", optional = true }
rayon = { version = "1", optional = true }

[features]
default = []
python = ["dep:pyo3", "dep:rayon"]
